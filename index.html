<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataWhiz - Analytics Dashboard</title>
  <meta name="description" content="Student performance and sales analytics. Pure HTML/CSS/JS, no build step.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3ClinearGradient id='g'%3E%3Cstop stop-color='%238a2be2'/%3E%3Cstop offset='1' stop-color='%23ff007f'/%3E%3C/linearGradient%3E%3Crect width='100' height='100' rx='25' fill='url(%23g)'/%3E%3Cpath d='M25 75l17-25 16 12 17-32M25 75h50' stroke='%23fff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='75' cy='30' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- Slim static sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DataWhiz</div>
      </div>

      <div class="nav-section">Modules</div>
      <nav class="nav" id="nav"><!-- populated by app.js from registry --></nav>
    </aside>

    <!-- Main content -->
    <main class="main">
      <!-- Top-right toolbar (just theme toggle now) -->
      <div class="topbar">
        <button id="theme-toggle" class="tbtn" title="Toggle theme">☀</button>
      </div>

      <div class="content">
        <div id="views"><!-- view sections populated from registry --></div>
      </div>
    </main>

  </div>

  <!-- Chart fullscreen modal (single global instance) -->
  <div id="chart-modal" class="chart-modal" aria-hidden="true">
    <div class="chart-modal-backdrop" data-action="close-modal"></div>
    <div class="chart-modal-content">
      <div class="chart-modal-header">
        <h3 id="chart-modal-title">Chart</h3>
        <button type="button" class="chart-modal-close" data-action="close-modal" aria-label="Close">✕</button>
      </div>
      <div class="chart-modal-body" id="chart-modal-body"><!-- chart cloned here --></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
